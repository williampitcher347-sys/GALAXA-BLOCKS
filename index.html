<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BlockVerse Platform</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: radial-gradient(circle at top, #1a2340, #05060a);
      color: #fff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #topBar {
      height: 56px;
      background: rgba(5, 6, 15, 0.95);
      border-bottom: 2px solid #0af;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    #logo {
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 18px;
      color: #0af;
      text-shadow: 0 0 8px #0af;
    }
    #profile {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 13px;
    }
    #avatar {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: linear-gradient(135deg, #0af, #7f5dff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 16px;
    }
    #xpBar {
      width: 160px;
      height: 8px;
      background: #111;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #0af;
    }
    #xpFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0af, #0f0);
    }
    #main {
      flex: 1;
      display: flex;
      min-height: 0;
    }
    #sidebar {
      width: 260px;
      background: rgba(5, 6, 15, 0.96);
      border-right: 2px solid #0af;
      padding: 12px;
      overflow-y: auto;
    }
    #sidebar h2 {
      margin: 0 0 10px;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #7fd0ff;
    }
    .game-card {
      background: #111522;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 8px;
      border: 1px solid #1b2a4a;
      cursor: pointer;
      transition: 0.15s;
      font-size: 13px;
    }
    .game-card:hover {
      border-color: #0af;
      box-shadow: 0 0 10px rgba(0,170,255,0.5);
      transform: translateY(-1px);
    }
    .game-title {
      font-weight: bold;
      color: #0af;
      margin-bottom: 2px;
    }
    .game-meta {
      font-size: 11px;
      opacity: 0.7;
    }
    #content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 10px 14px;
      gap: 8px;
      min-width: 0;
    }
    #headerRow {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    #gameTitle {
      font-size: 18px;
      font-weight: bold;
      text-shadow: 0 0 6px #000;
    }
    #modeTabs {
      display: flex;
      gap: 6px;
    }
    .tab {
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid #1b2a4a;
      cursor: pointer;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      opacity: 0.8;
    }
    .tab.active {
      border-color: #0af;
      background: rgba(0,170,255,0.15);
      opacity: 1;
    }
    #gameArea {
      flex: 1;
      background: rgba(3, 4, 12, 0.95);
      border-radius: 10px;
      border: 1px solid #1b2a4a;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      min-height: 0;
    }
    canvas {
      border-radius: 8px;
      border: 2px solid #0af;
      background: #000;
      box-shadow: 0 0 20px rgba(0,170,255,0.4);
    }
    #hint {
      position: absolute;
      bottom: 8px;
      left: 12px;
      font-size: 11px;
      opacity: 0.8;
    }
    #emptyState {
      text-align: center;
      opacity: 0.8;
      font-size: 14px;
    }
    #emptyState h3 {
      margin-bottom: 6px;
      font-size: 18px;
    }
    #emptyState p {
      margin: 2px 0;
    }
  </style>
</head>
<body>
  <div id="topBar">
    <div id="logo">BLOCKVERSE</div>
    <div id="profile">
      <div id="avatar">W</div>
      <div>
        <div id="playerName">Guest_001</div>
        <div style="font-size:11px;opacity:0.7;">
          Level <span id="level">1</span> • <span id="xpText">0 / 100 XP</span>
        </div>
      </div>
      <div id="xpBar"><div id="xpFill"></div></div>
    </div>
  </div>

  <div id="main">
    <div id="sidebar">
      <h2>Experiences</h2>
      <div id="gameList"></div>
    </div>
    <div id="content">
      <div id="headerRow">
        <div id="gameTitle">Welcome to BlockVerse</div>
        <div id="modeTabs">
          <div class="tab active" data-mode="play">Play</div>
          <div class="tab" data-mode="edit">Edit</div>
        </div>
      </div>
      <div id="gameArea">
        <div id="emptyState">
          <h3>Select an experience</h3>
          <p>Choose a game on the left to jump into a world.</p>
          <p style="font-size:12px;opacity:0.7;">This is a mini Roblox‑style platform prototype.</p>
        </div>
        <div id="hint"></div>
      </div>
    </div>
  </div>

  <script>
    // ===== GLOBAL PLAYER PROGRESSION =====
    let level = 1;
    let xp = 0;
    let xpToNext = 100;

    const levelEl = document.getElementById("level");
    const xpFill = document.getElementById("xpFill");
    const xpText = document.getElementById("xpText");

    function addXP(amount) {
      xp += amount;
      while (xp >= xpToNext) {
        xp -= xpToNext;
        level++;
        xpToNext = Math.floor(xpToNext * 1.35);
      }
      updateXPUI();
    }

    function updateXPUI() {
      levelEl.textContent = level;
      xpFill.style.width = (xp / xpToNext * 100) + "%";
      xpText.textContent = xp + " / " + xpToNext + " XP";
    }
    updateXPUI();

    // ===== INPUT STATE =====
    let keys = {};
    window.addEventListener("keydown", e => keys[e.key] = true);
    window.addEventListener("keyup", e => keys[e.key] = false);

    // ===== PLATFORM: EXPERIENCE REGISTRY =====
    const gameListEl = document.getElementById("gameList");
    const gameTitleEl = document.getElementById("gameTitle");
    const gameArea = document.getElementById("gameArea");
    const hintEl = document.getElementById("hint");
    const tabs = document.querySelectorAll(".tab");

    let currentLoop = null;
    let currentMode = "play";
    let currentExperience = null;

    const experiences = [
      {
        id: "blockworld",
        title: "BlockWorld Plaza",
        genre: "Sandbox Platformer",
        players: "1–4 (local feel)",
        startPlay: startBlockWorldPlay,
        startEdit: startBlockWorldEdit
      },
      {
        id: "obby",
        title: "Sky Obby Trial",
        genre: "Obby / Parkour",
        players: "Single‑player",
        startPlay: startObbyPlay,
        startEdit: null
      },
      {
        id: "arena",
        title: "Laser Arena Bots",
        genre: "Top‑Down Shooter",
        players: "Single‑player vs bots",
        startPlay: startArenaPlay,
        startEdit: null
      }
      // You can add more experiences here later
    ];

    function buildGameList() {
      gameListEl.innerHTML = "";
      experiences.forEach(exp => {
        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
          <div class="game-title">${exp.title}</div>
          <div class="game-meta">${exp.genre}</div>
          <div class="game-meta">Players: ${exp.players}</div>
        `;
        card.onclick = () => loadExperience(exp);
        gameListEl.appendChild(card);
      });
    }
    buildGameList();

    tabs.forEach(tab => {
      tab.addEventListener("click", () => {
        tabs.forEach(t => t.classList.remove("active"));
        tab.classList.add("active");
        currentMode = tab.dataset.mode;
        if (currentExperience) loadExperience(currentExperience);
      });
    });

    function clearGameArea() {
      if (currentLoop) cancelAnimationFrame(currentLoop);
      currentLoop = null;
      while (gameArea.firstChild) {
        gameArea.removeChild(gameArea.firstChild);
      }
      gameArea.appendChild(hintEl);
    }

    function loadExperience(exp) {
      currentExperience = exp;
      clearGameArea();
      gameTitleEl.textContent = exp.title;

      if (currentMode === "edit" && exp.startEdit) {
        exp.startEdit();
      } else if (currentMode === "edit" && !exp.startEdit) {
        const msg = document.createElement("div");
        msg.id = "emptyState";
        msg.innerHTML = "<h3>No editor for this experience</h3><p>Switch to Play mode to jump in.</p>";
        gameArea.appendChild(msg);
      } else {
        exp.startPlay();
      }
    }

    // ===== EXPERIENCE 1: BLOCKWORLD PLAZA =====
    // Shared world data for play + edit
    const BW_COLS = 32;
    const BW_ROWS = 18;
    const BW_TILE_SIZE = 32;
    let blockWorldData = null;

    function getDefaultBlockWorld() {
      const grid = [];
      for (let y = 0; y < BW_ROWS; y++) {
        const row = [];
        for (let x = 0; x < BW_COLS; x++) {
          if (y === BW_ROWS - 2) row.push(1); // ground
          else if (y === BW_ROWS - 5 && x % 4 === 0) row.push(1);
          else row.push(0);
        }
        grid.push(row);
      }
      return grid;
    }

    function loadBlockWorldFromStorage() {
      try {
        const raw = localStorage.getItem("blockverse_blockworld");
        if (!raw) return getDefaultBlockWorld();
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) return getDefaultBlockWorld();
        return parsed;
      } catch {
        return getDefaultBlockWorld();
      }
    }

    function saveBlockWorldToStorage(grid) {
      try {
        localStorage.setItem("blockverse_blockworld", JSON.stringify(grid));
      } catch {}
    }

    // --- PLAY MODE ---
    function startBlockWorldPlay() {
      hintEl.textContent = "A/D or Arrows to move • Space/W/Up to jump • Reach the right side";
      const canvas = document.createElement("canvas");
      canvas.width = BW_COLS * BW_TILE_SIZE;
      canvas.height = BW_ROWS * BW_TILE_SIZE;
      const ctx = canvas.getContext("2d");
      gameArea.appendChild(canvas);

      blockWorldData = loadBlockWorldFromStorage();

      const player = { x: 40, y: 40, w: 24, h: 32, vx: 0, vy: 0, onGround: false };
      const gravity = 0.7;
      const moveSpeed = 3.2;
      const jumpPower = 11;
      let reachedEnd = false;

      function rectIntersect(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function resolveCollisions(horizontal) {
        player.onGround = false;
        const ts = BW_TILE_SIZE;
        const minX = Math.floor(player.x / ts) - 1;
        const maxX = Math.floor((player.x + player.w) / ts) + 1;
        const minY = Math.floor(player.y / ts) - 1;
        const maxY = Math.floor((player.y + player.h) / ts) + 1;

        for (let y = minY; y <= maxY; y++) {
          for (let x = minX; x <= maxX; x++) {
            if (y < 0 || y >= BW_ROWS || x < 0 || x >= BW_COLS) continue;
            if (blockWorldData[y][x] === 0) continue;
            const tileRect = { x: x * ts, y: y * ts, w: ts, h: ts };
            const pRect = { x: player.x, y: player.y, w: player.w, h: player.h };
            if (rectIntersect(pRect, tileRect)) {
              if (horizontal) {
                if (player.vx > 0) player.x = tileRect.x - player.w;
                else if (player.vx < 0) player.x = tileRect.x + tileRect.w;
                player.vx = 0;
              } else {
                if (player.vy > 0) {
                  player.y = tileRect.y - player.h;
                  player.onGround = true;
                } else if (player.vy < 0) {
                  player.y = tileRect.y + tileRect.h;
                }
                player.vy = 0;
              }
            }
          }
        }
      }

      function update() {
        let input = 0;
        if (keys["a"] || keys["ArrowLeft"]) input -= 1;
        if (keys["d"] || keys["ArrowRight"]) input += 1;
        player.vx = input * moveSpeed;
        player.vy += gravity;

        if ((keys[" "] || keys["w"] || keys["ArrowUp"]) && player.onGround) {
          player.vy = -jumpPower;
        }

        player.x += player.vx;
        resolveCollisions(true);
        player.y += player.vy;
        resolveCollisions(false);

        if (player.x + player.w > canvas.width - 10 && !reachedEnd) {
          reachedEnd = true;
          addXP(50);
        }
      }

      function draw() {
        ctx.fillStyle = "#05060f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < BW_ROWS; y++) {
          for (let x = 0; x < BW_COLS; x++) {
            if (blockWorldData[y][x] === 1) {
              const sx = x * BW_TILE_SIZE;
              const sy = y * BW_TILE_SIZE;
              ctx.fillStyle = "#1f2438";
              ctx.fillRect(sx, sy, BW_TILE_SIZE, BW_TILE_SIZE);
              ctx.fillStyle = "#2f3b5a";
              ctx.fillRect(sx, sy, BW_TILE_SIZE, 6);
            }
          }
        }

        ctx.fillStyle = "#0af";
        ctx.fillRect(player.x, player.y, player.w, player.h);

        if (reachedEnd) {
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#0f0";
          ctx.font = "20px Arial";
          ctx.fillText("You reached the end! +50 XP", 40, 60);
        }
      }

      function loop() {
        update();
        draw();
        currentLoop = requestAnimationFrame(loop);
      }
      loop();
    }

    // --- EDIT MODE ---
    function startBlockWorldEdit() {
      hintEl.textContent = "Left click: toggle block • Right click: erase • Changes auto‑save";
      const canvas = document.createElement("canvas");
      canvas.width = BW_COLS * BW_TILE_SIZE;
      canvas.height = BW_ROWS * BW_TILE_SIZE;
      const ctx = canvas.getContext("2d");
      gameArea.appendChild(canvas);

      blockWorldData = loadBlockWorldFromStorage();

      let isMouseDown = false;
      let paintValue = 1;

      canvas.addEventListener("mousedown", e => {
        isMouseDown = true;
        paintValue = (e.button === 2) ? 0 : 1;
        paintAtEvent(e);
      });
      canvas.addEventListener("mouseup", () => isMouseDown = false);
      canvas.addEventListener("mouseleave", () => isMouseDown = false);
      canvas.addEventListener("mousemove", e => {
        if (isMouseDown) paintAtEvent(e);
      });
      canvas.addEventListener("contextmenu", e => e.preventDefault());

      function paintAtEvent(e) {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left;
        const my = e.clientY - rect.top;
        const gx = Math.floor(mx / BW_TILE_SIZE);
        const gy = Math.floor(my / BW_TILE_SIZE);
        if (gx >= 0 && gx < BW_COLS && gy >= 0 && gy < BW_ROWS) {
          blockWorldData[gy][gx] = paintValue;
          saveBlockWorldToStorage(blockWorldData);
        }
      }

      function draw() {
        ctx.fillStyle = "#05060f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < BW_ROWS; y++) {
          for (let x = 0; x < BW_COLS; x++) {
            const sx = x * BW_TILE_SIZE;
            const sy = y * BW_TILE_SIZE;
            if (blockWorldData[y][x] === 1) {
              ctx.fillStyle = "#1f2438";
              ctx.fillRect(sx, sy, BW_TILE_SIZE, BW_TILE_SIZE);
              ctx.fillStyle = "#2f3b5a";
              ctx.fillRect(sx, sy, BW_TILE_SIZE, 6);
            }
            ctx.strokeStyle = "rgba(255,255,255,0.05)";
            ctx.strokeRect(sx, sy, BW_TILE_SIZE, BW_TILE_SIZE);
          }
        }
      }

      function loop() {
        draw();
        currentLoop = requestAnimationFrame(loop);
      }
      loop();
    }

    // ===== EXPERIENCE 2: SKY OBBY TRIAL =====
    function startObbyPlay() {
      hintEl.textContent = "A/D or Arrows to move • Space/W/Up to jump • Don’t fall";
      const canvas = document.createElement("canvas");
      canvas.width = 800;
      canvas.height = 450;
      const ctx = canvas.getContext("2d");
      gameArea.appendChild(canvas);

      const platforms = [
        { x: 40, y: 360, w: 120, h: 20 },
        { x: 220, y: 320, w: 100, h: 20 },
        { x: 380, y: 280, w: 100, h: 20 },
        { x: 540, y: 240, w: 100, h: 20 },
        { x: 700, y: 200, w: 80, h: 20 }
      ];
      const player = { x: 60, y: 320, w: 24, h: 32, vx: 0, vy: 0, onGround: false };
      const gravity = 0.7;
      const moveSpeed = 3.2;
      const jumpPower = 11;
      let finished = false;

      function rectIntersect(a, b) {
        return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
      }

      function update() {
        let input = 0;
        if (keys["a"] || keys["ArrowLeft"]) input -= 1;
        if (keys["d"] || keys["ArrowRight"]) input += 1;
        player.vx = input * moveSpeed;
        player.vy += gravity;

        if ((keys[" "] || keys["w"] || keys["ArrowUp"]) && player.onGround) {
          player.vy = -jumpPower;
        }

        player.x += player.vx;
        player.onGround = false;
        for (let p of platforms) {
          if (rectIntersect(player, p)) {
            if (player.vx > 0) player.x = p.x - player.w;
            else if (player.vx < 0) player.x = p.x + p.w;
            player.vx = 0;
          }
        }

        player.y += player.vy;
        for (let p of platforms) {
          if (rectIntersect(player, p)) {
            if (player.vy > 0) {
              player.y = p.y - player.h;
              player.onGround = true;
            } else if (player.vy < 0) {
              player.y = p.y + p.h;
            }
            player.vy = 0;
          }
        }

        if (player.y > canvas.height + 50) {
          player.x = 60;
          player.y = 320;
          player.vx = player.vy = 0;
          finished = false;
        }

        const last = platforms[platforms.length - 1];
        if (player.x + player.w > last.x && player.y + player.h <= last.y + 5 && !finished) {
          finished = true;
          addXP(40);
        }
      }

      function draw() {
        ctx.fillStyle = "#05081a";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
        grad.addColorStop(0, "#1a3b7f");
        grad.addColorStop(1, "#05081a");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#fff";
        for (let i = 0; i < 40; i++) {
          ctx.globalAlpha = 0.2;
          ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height*0.5, 2, 2);
        }
        ctx.globalAlpha = 1;

        ctx.fillStyle = "#3f8cff";
        for (let p of platforms) {
          ctx.fillRect(p.x, p.y, p.w, p.h);
        }

        ctx.fillStyle = "#0af";
        ctx.fillRect(player.x, player.y, player.w, player.h);

        if (finished) {
          ctx.fillStyle = "rgba(0,0,0,0.6)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#0f0";
          ctx.font = "20px Arial";
          ctx.fillText("Obby complete! +40 XP", 40, 60);
        }
      }

      function loop() {
        update();
        draw();
        currentLoop = requestAnimationFrame(loop);
      }
      loop();
    }

    // ===== EXPERIENCE 3: LASER ARENA BOTS =====
    function startArenaPlay() {
      hintEl.textContent = "WASD to move • Mouse to aim • Click to shoot";
      const canvas = document.createElement("canvas");
      canvas.width = 800;
      canvas.height = 450;
      const ctx = canvas.getContext("2d");
      gameArea.appendChild(canvas);

      const player = { x: 400, y: 225, r: 14, speed: 3, reload: 0, hp: 100 };
      const bullets = [];
      const enemies = [];
      let spawnTimer = 0;
      let score = 0;

      const mouse = { x: canvas.width/2, y: canvas.height/2, down: false };
      canvas.addEventListener("mousemove", e => {
        const rect = canvas.getBoundingClientRect();
        mouse.x = e.clientX - rect.left;
        mouse.y = e.clientY - rect.top;
      });
      canvas.addEventListener("mousedown", () => mouse.down = true);
      canvas.addEventListener("mouseup", () => mouse.down = false);

      function spawnEnemy() {
        const side = Math.floor(Math.random() * 4);
        let x, y;
        if (side === 0) { x = 0; y = Math.random() * canvas.height; }
        if (side === 1) { x = canvas.width; y = Math.random() * canvas.height; }
        if (side === 2) { x = Math.random() * canvas.width; y = 0; }
        if (side === 3) { x = Math.random() * canvas.width; y = canvas.height; }
        enemies.push({ x, y, r: 12, speed: 1.4 + Math.random()*0.8, hp: 30 });
      }

      function update() {
        let dx = 0, dy = 0;
        if (keys["w"]) dy -= 1;
        if (keys["s"]) dy += 1;
        if (keys["a"]) dx -= 1;
        if (keys["d"]) dx += 1;
        const len = Math.hypot(dx, dy) || 1;
        dx /= len; dy /= len;
        player.x += dx * player.speed;
        player.y += dy * player.speed;
        player.x = Math.max(0, Math.min(canvas.width, player.x));
        player.y = Math.max(0, Math.min(canvas.height, player.y));

        if (player.reload > 0) player.reload--;
        if (mouse.down && player.reload === 0 && player.hp > 0) {
          const angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);
          bullets.push({ x: player.x, y: player.y, vx: Math.cos(angle)*7, vy: Math.sin(angle)*7, life: 70 });
          player.reload = 8;
        }

        for (let b of bullets) {
          b.x += b.vx;
          b.y += b.vy;
          b.life--;
        }
        for (let i = bullets.length-1; i >= 0; i--) {
          if (bullets[i].life <= 0) bullets.splice(i, 1);
        }

        spawnTimer--;
        if (spawnTimer <= 0) {
          spawnEnemy();
          spawnTimer = 50;
        }

        for (let e of enemies) {
          const angle = Math.atan2(player.y - e.y, player.x - e.x);
          e.x += Math.cos(angle)*e.speed;
          e.y += Math.sin(angle)*e.speed;
        }

        for (let i = enemies.length-1; i >= 0; i--) {
          const e = enemies[i];
          const distP = Math.hypot(e.x - player.x, e.y - player.y);
          if (distP < e.r + player.r && player.hp > 0) {
            player.hp -= 0.4;
            if (player.hp <= 0) {
              player.hp = 0;
            }
          }
          for (let j = bullets.length-1; j >= 0; j--) {
            const b = bullets[j];
            const distB = Math.hypot(e.x - b.x, e.y - b.y);
            if (distB < e.r + 4) {
              e.hp -= 20;
              bullets.splice(j, 1);
              if (e.hp <= 0) {
                enemies.splice(i, 1);
                score++;
                addXP(8);
              }
              break;
            }
          }
        }
      }

      function draw() {
        ctx.fillStyle = "#05060f";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.strokeStyle = "#1b2a4a";
        ctx.lineWidth = 1;
        for (let x = 0; x < canvas.width; x += 40) {
          ctx.beginPath();
          ctx.moveTo(x, 0);
          ctx.lineTo(x, canvas.height);
          ctx.stroke();
        }
        for (let y = 0; y < canvas.height; y += 40) {
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(canvas.width, y);
          ctx.stroke();
        }

        ctx.fillStyle = "#ff0";
        for (let b of bullets) {
          ctx.beginPath();
          ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
          ctx.fill();
        }

        ctx.fillStyle = "#f44";
        for (let e of enemies) {
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.r, 0, Math.PI*2);
          ctx.fill();
        }

        ctx.fillStyle = "#0af";
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.r, 0, Math.PI*2);
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.font = "12px Arial";
        ctx.fillText("Score: " + score, 10, 20);
        ctx.fillText("HP: " + Math.floor(player.hp), 10, 36);

        if (player.hp <= 0) {
          ctx.fillStyle = "rgba(0,0,0,0.7)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#f44";
          ctx.font = "22px Arial";
          ctx.fillText("You were eliminated!", 40, 60);
          ctx.font = "14px Arial";
          ctx.fillText("Refresh or switch experiences to restart.", 40, 84);
        }
      }

      function loop() {
        update();
        draw();
        currentLoop = requestAnimationFrame(loop);
      }
      loop();
    }
  </script>
</body>
